name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Select Visual Studio 2022 toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: "17.0"

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - run: npm ci
      - run: npm run check
      - run: cargo test --manifest-path desktop/src-tauri/Cargo.toml
      # The Android module has no unit/instrumentation tests yet. Run this
      # check automatically as soon as test sources are added.
      - name: Run Android unit tests
        if: ${{ hashFiles('android/app/src/test/**/*.kt', 'android/app/src/test/**/*.java', 'android/app/src/androidTest/**/*.kt', 'android/app/src/androidTest/**/*.java') != '' }}
        run: android\gradlew.bat :app:testDebugUnitTest
