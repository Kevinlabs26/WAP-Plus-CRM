name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - run: npm ci
      - run: npm run check
      - run: cargo test --manifest-path desktop/src-tauri/Cargo.toml
      - name: Check Android bounded input
        shell: pwsh
        run: |
          $checkDir = Join-Path $env:RUNNER_TEMP 'bridge-security-check'
          New-Item -ItemType Directory -Force -Path $checkDir | Out-Null
          javac -d $checkDir android/app/src/main/java/com/wapplus/bridge/net/BoundedInput.java android/app/src/main/java/com/wapplus/bridge/net/BridgeWorkers.java android/app/src/test/java/com/wapplus/bridge/net/BoundedInputCheck.java
          if ($LASTEXITCODE -ne 0) { throw 'Security check compilation failed' }
          java -ea -cp $checkDir com.wapplus.bridge.net.BoundedInputCheck
          if ($LASTEXITCODE -ne 0) { throw 'Security check failed' }
      - name: Run Android unit tests
        if: ${{ hashFiles('android/app/src/test/**/*.kt', 'android/app/src/test/**/*.java', 'android/app/src/androidTest/**/*.kt', 'android/app/src/androidTest/**/*.java') != '' }}
        working-directory: android
        run: .\gradlew.bat --dependency-verification strict :app:testDebugUnitTest :app:assembleDebug
