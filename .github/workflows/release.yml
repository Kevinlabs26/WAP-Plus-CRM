name: Publish Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: desktop/src-tauri -> target
          # sherpa-rs embeds an absolute runner-local SHERPA_LIB_PATH in its
          # build-script output; reusing target across runners leaves stale
          # linker paths such as cargs.lib.
          cache-targets: false

      - name: Install dependencies
        run: npm ci

      - name: Run tests and frontend build
        run: npm run check

      - name: Run Rust tests
        run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml

      - name: Resolve and validate release tag
        shell: pwsh
        run: |
          $config = Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $releaseTag = "v$($config.version)"
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne $releaseTag) {
            throw "Git tag $env:GITHUB_REF_NAME does not match app version $releaseTag"
          }
          "RELEASE_TAG=$releaseTag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and upload draft Tauri release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: v__VERSION__
          releaseName: WAP Plus CRM v__VERSION__
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false

      - name: Smoke test packaged Windows installer
        shell: pwsh
        run: .github/scripts/smoke-windows-installer.ps1

      - name: Publish verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$env:RELEASE_TAG" --draft=false
