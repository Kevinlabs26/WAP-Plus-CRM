name: Publish Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          # sherpa-rs embeds an absolute runner-local SHERPA_LIB_PATH in its
          # build-script output; reusing target across runners leaves stale
          # linker paths such as cargs.lib.
          cache-targets: false

      - name: Install dependencies
        run: npm ci

      - name: Run tests and frontend build
        run: npm run check

      - name: Build and publish Tauri installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: v__VERSION__
          releaseName: WAP Plus CRM v__VERSION__
          releaseBody: See the Windows installers in the assets below.
          releaseDraft: false
          prerelease: false
