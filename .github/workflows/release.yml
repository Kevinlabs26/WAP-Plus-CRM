name: Publish desktop release

on:
  workflow_dispatch:
    inputs:
      notarize_macos:
        description: Sign and notarize the macOS DMGs using the configured Apple credentials
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/macos.yml
    with:
      notarize: ${{ inputs.notarize_macos == true }}
    secrets: inherit

  build-windows:
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: desktop/src-tauri -> target
          # sherpa-rs embeds an absolute runner-local SHERPA_LIB_PATH in its
          # build-script output; reusing target across runners leaves stale
          # linker paths such as cargs.lib.
          cache-targets: false

      - name: Install dependencies
        run: npm ci

      - name: Set up Java for the Android Bridge
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Prepare Android Bridge APK
        run: npm run android:bridge:prepare

      - name: Run tests and frontend build
        run: npm run check
        timeout-minutes: 10

      - name: Run Rust tests
        run: cargo test --locked --lib --tests --manifest-path desktop/src-tauri/Cargo.toml

      - name: Validate Google login release configuration
        env:
          GOOGLE_DESKTOP_CLIENT_JSON: ${{ secrets.GOOGLE_DESKTOP_CLIENT_JSON }}
        run: node --experimental-strip-types .github/scripts/prepare-google-client.mjs

      - name: Resolve and validate release tag
        shell: pwsh
        run: |
          $config = Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $releaseTag = "v$($config.version)"
          if ($env:GITHUB_REF_TYPE -ne "tag" -or $env:GITHUB_REF_NAME -ne $releaseTag) {
            throw "Git tag $env:GITHUB_REF_NAME does not match app version $releaseTag"
          }

      - name: Build and upload draft Tauri release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: v__VERSION__
          releaseName: WAP Plus CRM v__VERSION__
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false

      - name: Smoke test packaged Windows installer
        shell: pwsh
        run: .github/scripts/smoke-windows-installer.ps1

  publish:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: macos-update-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: macos-*
          path: release-assets
          merge-multiple: true
      - name: Publish both platforms and advance the macOS update feed
        env:
          GH_TOKEN: ${{ github.token }}
          NOTARIZE: ${{ inputs.notarize_macos == true }}
        run: bash .github/scripts/publish-desktop-release.sh
