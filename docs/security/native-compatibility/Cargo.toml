[package]
name = "bridgecrm-native-compatibility"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
chrono = "=0.4.45"
tracing = "=0.1.44"
sherpa-onnx = { version = "=1.13.8", optional = true }

[features]
speech = ["dep:sherpa-onnx"]
