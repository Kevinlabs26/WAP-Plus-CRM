[package]
name = "wap-plus-crm"
version = "0.1.0"
description = "WAP Plus CRM — WhatsApp sales CRM desktop"
authors = ["WAP Plus CRM"]
edition = "2021"

[lib]
name = "wap_plus_crm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
test = false

[[bin]]
name = "wap-plus-crm"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "time"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
tar = "0.4"
bzip2 = "0.4"
# 本地语音识别：构建期拉取预编译 sherpa-onnx 库，运行期零网络
sherpa-rs = { version = "0.5", features = ["download-binaries"] }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7"
windows-registry = "0.6"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
